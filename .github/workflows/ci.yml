name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: train/requirements.txt
      - name: Install CPU PyTorch and tools
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r train/requirements.txt
      - name: Train v1 (CPU, seed 1)
        run: python train/train.py --seed 1 --epochs 12 --out out/ci/v1 --version v1
      - name: Export and quantize
        run: python train/export.py --dir out/ci/v1
      - name: Quality gate
        run: python train/gate.py out/ci/v1
      - name: Reproducibility against the committed run (0.5 point limit)
        run: |
          python - <<'PY'
          import json
          a = json.load(open("models/v1/metrics.json"))["fp32_test_macro_f1"]
          b = json.load(open("out/ci/v1/metrics.json"))["fp32_test_macro_f1"]
          d = abs(a - b) * 100
          print(f"committed {a:.5f} ci {b:.5f} difference {d:.3f} points")
          assert d <= 0.5
          PY
      - name: Gate the committed models too
        run: python train/gate.py models/v1 models/v2
      - uses: actions/upload-artifact@v4
        with:
          name: model-ci-metrics
          path: out/ci/v1/metrics.json

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fetch ONNX Runtime (pinned, checksum verified)
        run: scripts/fetch-onnxruntime.sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: false
          format: false
          push: false
      - name: Race tests (tokenizer golden, parity, batcher, server, SIGTERM drain)
        run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t localhost/inference-gateway:dev .
      - name: Trivy scan (fail on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: localhost/inference-gateway:dev
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tool versions
        run: kind version && helm version --short && kubectl version --client
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Build image
        run: docker build -f Containerfile -t localhost/inference-gateway:dev .
      - name: Kubernetes checks
        env:
          CONTAINER_TOOL: docker
        run: scripts/kind-e2e.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: out/e2e-report.txt
