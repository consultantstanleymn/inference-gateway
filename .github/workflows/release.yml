name: release
# Runs when a version tag is pushed. Authored, not run.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX Runtime
        run: scripts/fetch-onnxruntime.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-image.cdx.json
      - name: Attach the SBOM to the image
        run: cosign attest --yes --type cyclonedx --predicate sbom-image.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Release manifest
        run: python3 scripts/release_manifest.py --image "${IMAGE}:${{ github.ref_name }}" --out release/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            sbom-image.cdx.json
            release/manifest.json
