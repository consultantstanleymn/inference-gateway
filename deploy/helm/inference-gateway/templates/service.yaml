apiVersion: v1
kind: Service
metadata:
  name: {{ include "ig.name" . }}
  labels: {{- include "ig.labels" . | nindent 4 }}
spec:
  selector: {{- include "ig.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
